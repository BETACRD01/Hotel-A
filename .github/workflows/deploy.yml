name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django check
      run: |
        python manage.py check
      env:
        SECRET_KEY: test-secret-key-for-check
        DEBUG: True
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy via IAP tunnel
      run: |
        gcloud compute ssh free-ubuntu-vm \
          --zone=us-central1-a \
          --project=delivery-109f4 \
          --tunnel-through-iap \
          --command='
            cd /var/www/hoteleroarahuana && \
            sudo -u deployer git pull origin main && \
            sudo -u deployer bash -c "cd /var/www/hoteleroarahuana && source venv/bin/activate && pip install -r requirements.txt" && \
            sudo -u deployer bash -c "cd /var/www/hoteleroarahuana && source venv/bin/activate && python manage.py migrate --noinput" && \
            sudo -u deployer bash -c "cd /var/www/hoteleroarahuana && source venv/bin/activate && python manage.py collectstatic --noinput" && \
            sudo systemctl restart hotel && \
            sudo systemctl restart nginx
          '

    - name: Deploy complete
      run: echo "Deployment completed successfully!"
